name: AutoWave

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  AutoWave:
    type: application
    platform: iOS
    sources: [AutoWave]
    resources: [AutoWave/Resources/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skier.autowave
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: AutoWave/Info.plist
      properties:
        CFBundleDisplayName: AutoWave
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AutoWaveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AutoWaveTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AutoWave

schemes:
  AutoWave:
    shared: true
    build:
      targets:
        AutoWave: all
        AutoWaveTests: [test]
    test:
      targets:
        - AutoWaveTests
